[tool.ruff]
line-length = 100
target-version = "py311"

extend-exclude = [
  ".git",
  "__pycache__",
  ".claude",
  "data",
  "output",
  "logs",
  "assets",
  "brand/fonts",
  "node_modules",
]

[tool.ruff.lint]
# Minimal ruleset per audit decision L. Catches dead imports (F401),
# undefined names (F821), redefined names (F811), comparison errors
# (E711/E712). Does NOT include style or formatting rules, those would
# require a separate format-churn commit.
select = ["F401", "F821", "F811", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# Files on the Phase G deletion list. Add entries here ONLY for
# confirmed-dormant code that's about to be deleted; do not use as a
# workaround for live code with real violations.
"src/research/rare_fact_bank.py" = ["F401"]    # Phase G.1, retiring.
"pipelines/reel/runway.py" = ["F401"]          # Phase G.3, deleting.
"pipelines/shared/publish_now.py" = ["F401"]   # Phase G.3, deleting.
"pipelines/list/ship_list_post.py" = ["F401"]  # Phase G.3, deleting.
