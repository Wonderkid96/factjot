[tool.ruff]
line-length = 100
target-version = "py311"

extend-exclude = [
  ".git",
  "__pycache__",
  ".claude",
  "data",
  "output",
  "logs",
  "assets",
  "brand/fonts",
  "node_modules",
]

[tool.ruff.lint]
# Minimal ruleset per audit decision L. Catches dead imports (F401),
# undefined names (F821), redefined names (F811), comparison errors
# (E711/E712). Does NOT include style or formatting rules, those would
# require a separate format-churn commit.
select = ["F401", "F821", "F811", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# Add entries here ONLY for confirmed-dormant code that is genuinely
# about to be deleted; do not use as a workaround for live code with
# real violations. Phase G (G.1 + G.2 + G.3) shipped on 2026-05-10
# and the previous entries pointed at files that no longer exist.
