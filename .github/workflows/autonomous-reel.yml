name: Autonomous Post — Claude Agent (manual)

# Claude Code CLI is dropped into the repo with Bash access.
# No topic constraint. No template. The agent reads the repo, decides what
# to post and in what format (reel or carousel), then calls the pipeline.
#
# Requires ANTHROPIC_API_KEY secret.
# Default: dry-run OFF — this is the live autonomous post.

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 16:00 BST (primary)
    - cron: "45 15 * * *"  # 15:45 UTC = 16:45 BST (backup)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compose content but skip upload and publish"
        type: boolean
        default: false
        required: false

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Run autonomous Claude agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          claude --print \
            "You are running the factjot Instagram account (@factjot).

          Your job: post something genuinely interesting. Complete creative freedom. No topic constraint. No template.

          The factjot voice is dry, direct, faintly contemptuous of people who don't find things interesting. British English. No em dashes. No corporate enthusiasm.

          First, read CLAUDE.md to understand the project. Then read insta-brain/data/posted.jsonl to see what has already been posted. Choose something that is not already covered.

          You may post in either format. Choose whichever suits the content.

          --- REEL ---
          A single striking fact, narrated to camera. Best for: a jaw-dropping claim, a moment in history, something visual.

            python3 -u pipelines/reel/make_reel.py \\
              --script \"70-120 word script, first sentence is the most surprising\" \\
              --title \"hook title\" \\
              --topic <history|science|biology|ocean|earth|space|technology> \\
              --tone-override <shocking|curious|sober|wholesome> \\
              --hint \"2-5 word footage hint\" \\
              $([ \"\$DRY_RUN\" = \"true\" ] && echo \"--dry-run\")

          --- CAROUSEL ---
          A news story, explainer, or editorial take. Best for: current events, a subject with multiple angles, anything that needs more than one sentence.

            python3 -u pipelines/manual/ship_manual_post.py \\
              --brief \"plain-English description of what to post, 2-4 sentences\" \\
              --label \"CATEGORY IN CAPS\" \\
              --slides 6 \\
              $([ \"\$DRY_RUN\" = \"true\" ] && echo \"--dry-run\")

          Pick one format. Run it once. Do not retry on failure." \
            --allowedTools "Bash" \
            --max-turns 40

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/autonomous-reel.yml
          WORKFLOW_DISPLAY: autonomous-post
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 pipelines/shared/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/reels.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/ledgers/used_footage_urls.jsonl \
            data/ledgers/used_images.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: autonomous post $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
