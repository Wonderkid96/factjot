name: Autonomous Post (factjot agent)

# 3-slot daily schedule with fixed format slots (cut from 5 slots on 2026-05-10
# per audit Q4: distribution test - quality bet over volume):
#
#   reel_morning   09:00 BST  evergreen reel
#   list_midday    12:00 UTC  list carousel
#   reel_night     20:30 BST  evergreen reel
#
# Crons are UTC and tracked to BST (summer). When UK clocks fall back to
# GMT in October, the posts will fire at the same UK clock time still,
# since UTC == GMT. If you want exact 9am UK year-round, swap crons twice
# a year.
#
# Requires ANTHROPIC_API_KEY secret.
# Default: dry-run OFF for scheduled runs (live posting).

on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 UTC = 09:00 BST -> reel_morning
    - cron: "30 11 * * *"    # 11:30 UTC -> list_midday (~12:00 UTC post time)
    - cron: "30 19 * * *"    # 19:30 UTC = 20:30 BST -> reel_night
  workflow_dispatch:
    inputs:
      post_mode:
        description: "Post mode"
        type: choice
        options: [reel_morning, list_midday, reel_night]
        default: reel_morning
        required: true
      dry_run:
        description: "Dry run: compose content but skip upload and publish"
        type: boolean
        default: true
        required: false

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve post mode from schedule or input
        id: mode
        env:
          INPUT_MODE: ${{ inputs.post_mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          else
            case "$CRON" in
              "0 8 * * *")    MODE="reel_morning" ;;
              "30 11 * * *")  MODE="list_midday" ;;
              "30 19 * * *")  MODE="reel_night" ;;
              *)              MODE="reel_morning" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved post_mode=$MODE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 3
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Python dependencies
        timeout-minutes: 4
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          # Fall back to the most recent Playwright cache for this OS so a
          # requirements.txt edit (e.g. adding google-* libs for YouTube)
          # does not cause a full Chromium re-download. Playwright ignores
          # unrelated browser binaries, so the partial cache still helps.
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Refresh Meta access token (soft)
        continue-on-error: true
        run: python3 -u pipelines/shared/refresh_token.py

      - name: Run autonomous Claude agent
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POST_MODE: ${{ steps.mode.outputs.mode }}
        run: python3 -u scripts/autonomous_agent.py --post-mode "$POST_MODE"

      - name: Upload rendered slides + reel as artefact (dry-run only)
        if: ${{ always() && inputs.dry_run }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rendered-output-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: |
            output/manual/**
            output/reel/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Cross-post latest reel to YouTube as Short (soft)
        if: ${{ success() && (inputs.dry_run != 'true') && startsWith(steps.mode.outputs.mode, 'reel_') }}
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # Only fires if the agent posted a reel this run. The script
          # picks the latest entry from reels.jsonl and uploads its
          # final.mp4. If the latest reel was already on YouTube (same
          # title in youtube_uploads.jsonl), the script skips silently.
          python3 -u scripts/upload_to_youtube.py --auto-latest --privacy public || true

      - name: Fetch Instagram reel performance metrics (soft)
        if: always()
        continue-on-error: true
        run: python3 -u pipelines/reel/fetch_reel_metrics.py

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/autonomous-reel.yml
          WORKFLOW_DISPLAY: autonomous-post
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 pipelines/shared/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          # Stage each ledger separately so a missing file (e.g. the
          # youtube_uploads.jsonl on the very first cross-post) does
          # not abort the whole `git add`, which would silently leave
          # every other state file unstaged. The previous form did
          # exactly that on 2026-05-07 14:43.
          for f in \
            insta-brain/data/posted.jsonl \
            insta-brain/data/reels.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/ledgers/used_footage_urls.jsonl \
            data/ledgers/used_images.jsonl \
            data/ledgers/reel_performance.jsonl \
            data/ledgers/api_usage_costs.jsonl \
            data/ledgers/youtube_uploads.jsonl \
            data/ledgers/carousel_quality.jsonl
          do
            if [ -e "$f" ]; then
              git add "$f" || true
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "state: autonomous post $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
