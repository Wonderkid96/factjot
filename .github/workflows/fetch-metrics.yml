name: Daily Metrics Fetch (06:00 UTC)

# Lightweight daily job — fetches metrics for reels from the last 14 days
# and regenerates topic/tone scores. Fast (~5-10 API calls).
# The Sunday weekly-plan.yml handles the full 90-day historical refresh.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

concurrency:
  group: factjot-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          TIMEZONE=UTC
          ENVEOF

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Fetch recent reel metrics (last 14 days)
        env:
          METRICS_DAYS: "14"
        run: python3 scripts/fetch_reel_metrics.py || echo "Metrics fetch failed - continuing"

      - name: Score topic/tone performance
        run: python3 scripts/score_performance.py || echo "Scoring failed - continuing"

      - name: Commit and push updated scores
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            data/ledgers/reel_performance.jsonl \
            data/ledgers/topic_tone_scores.json \
            insta-brain/PERFORMANCE.md \
            || true
          git diff --cached --quiet && echo "No score changes." && exit 0
          git commit -m "state: metrics + scores $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
