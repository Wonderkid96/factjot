name: Guardian News Watcher

# Runs every 30 minutes. Lightweight -- no pip installs, pure stdlib only.
# When a significant breaking story is found, triggers news-carousel.yml
# via workflow_dispatch using the built-in GITHUB_TOKEN.
# Nothing is posted here -- this workflow only detects and nudges.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, 24/7
  workflow_dispatch:           # manual trigger for testing

permissions:
  contents: read
  actions: write               # needed to trigger news-carousel.yml

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest state (need current news_posts.jsonl for dedup)
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Check Guardian RSS feeds
        id: rss
        run: |
          # Run checker -- prints article URL to stdout if found, exits 1 if not
          ARTICLE_URL=$(python3 pipelines/news/check_guardian_rss.py 2>/dev/null) || true

          if [ -n "$ARTICLE_URL" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "article_url=$ARTICLE_URL" >> "$GITHUB_OUTPUT"
            echo "Breaking story found: $ARTICLE_URL"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No significant breaking news at this time."
          fi

      - name: Trigger news carousel
        if: steps.rss.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTICLE_URL="${{ steps.rss.outputs.article_url }}"
          echo "Triggering news-carousel.yml for: $ARTICLE_URL"
          gh workflow run news-carousel.yml \
            --ref main \
            --field article_url="$ARTICLE_URL"
