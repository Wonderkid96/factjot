name: Breaking News Watcher (Guardian)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: render/host but skip Instagram publish"
        type: boolean
        default: true
        required: false
      article_url:
        description: "Optional Guardian URL override"
        type: string
        required: false

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          TIMEZONE=UTC
          ENVEOF

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Resolve article URL (override or watcher)
        id: watcher
        run: |
          if [ -n "${{ inputs.article_url }}" ]; then
            URL="${{ inputs.article_url }}"
            echo "Using manual override URL: $URL"
            echo "article_url=$URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          URL="$(python3 -u pipelines/news/check_guardian_rss.py)"
          RC=$?
          set -e
          if [ $RC -ne 0 ] || [ -z "$URL" ]; then
            echo "No qualifying breaking story found."
            echo "article_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Detected breaking story: $URL"
          echo "article_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish breaking news carousel
        if: ${{ steps.watcher.outputs.article_url != '' }}
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          CMD=(python3 -u pipelines/news/ship_news_breaking.py --article-url "${{ steps.watcher.outputs.article_url }}")
          if [ "$DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi
          "${CMD[@]}"

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          for f in \
            data/ledgers/news_posts.jsonl \
            data/ledgers/used_images.jsonl \
            data/ledgers/api_usage_costs.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md
          do
            if [ -e "$f" ]; then
              git add "$f" || true
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "state: breaking news watcher $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
