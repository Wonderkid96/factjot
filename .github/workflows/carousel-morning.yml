name: Morning Carousel (10:00 UTC)

on:
  schedule:
    - cron: "45 9 * * *"   # 09:45 UTC — GitHub cron can drift, start early
  workflow_dispatch:

# Prevent two publish jobs running at the same time.
# If a manual trigger fires while the scheduled run is active, it queues
# rather than running in parallel (which would cause a git push conflict
# and leave posted.jsonl stale on GitHub).
concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history needed for rebase
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Post morning carousel
        run: |
          # Topics rotate by weekday so morning and evening cover different categories.
          # Mon=history Tue=space Wed=biology Thu=ocean Fri=earth Sat=history Sun=technology
          DAY=$(date +%u)
          case $DAY in
            1) TOPIC=history ;;
            2) TOPIC=space ;;
            3) TOPIC=biology ;;
            4) TOPIC=ocean ;;
            5) TOPIC=earth ;;
            6) TOPIC=history ;;
            7) TOPIC=technology ;;
          esac
          echo "Day $DAY -> topic=$TOPIC"
          python3 scripts/ship_first_post.py --topic "$TOPIC"

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/carousel-morning.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 scripts/log_workflow_failure.py
      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/posted_quotes.jsonl \
            insta-brain/data/queue.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/approval_queue.jsonl \
            data/ledgers/approval_queue.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: morning carousel $(date -u +%Y-%m-%dT%H:%M)Z"
          # Pull in any changes that landed after our checkout, then push.
          # --autostash handles any unstaged local changes from the pip/playwright steps.
          git pull --rebase --autostash origin main
          git push origin main
