name: Morning Carousel (10:00 BST)

on:
  schedule:
    - cron: "0 9 * * *"     # 09:00 UTC = 10:00 BST (primary)
    - cron: "45 9 * * *"    # 09:45 UTC = 10:45 BST (backup - skips if already posted)
  workflow_dispatch:

# Prevent two publish jobs running at the same time.
# If a manual trigger fires while the scheduled run is active, it queues
# rather than running in parallel (which would cause a git push conflict
# and leave posted.jsonl stale on GitHub).
concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history needed for rebase
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Verify Meta token
        run: |
          VALID=$(python3 pipelines/shared/check_token.py 2>/dev/null || echo invalid)
          if [ "$VALID" != "ok" ]; then
            echo "::error::Meta access token is invalid or expired. Run refresh_token.py manually."
            python3 pipelines/shared/log_token_alert.py 2>/dev/null || true
            exit 1
          fi
          echo "Token valid."

      - name: Check if carousel already posted today
        id: check
        run: |
          # Fail closed: if pull fails, we can't trust ledger state -- skip to be safe
          if ! git pull --rebase --autostash origin main 2>/dev/null; then
            echo "::warning::git pull failed -- skipping to prevent duplicate post"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: if check script errors or is missing -- skip to be safe
          CHECK_OUT=$(python3 pipelines/shared/check_posted_today.py carousel 2>/dev/null) || {
            echo "::warning::Idempotency check failed or script missing -- skipping to be safe"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if echo "$CHECK_OUT" | grep -q already_posted; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already posted today - skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post morning carousel
        if: steps.check.outputs.skip != 'true'
        run: |
          # Topics rotate by weekday so morning and evening cover different categories.
          # Mon=history Tue=space Wed=biology Thu=ocean Fri=earth Sat=history Sun=technology
          DAY=$(date +%u)
          case $DAY in
            1) TOPIC=history ;;
            2) TOPIC=space ;;
            3) TOPIC=biology ;;
            4) TOPIC=ocean ;;
            5) TOPIC=earth ;;
            6) TOPIC=history ;;
            7) TOPIC=technology ;;
          esac
          echo "Day $DAY -> topic=$TOPIC"
          python3 pipelines/carousel/ship_first_post.py --topic "$TOPIC"

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/carousel-morning.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 pipelines/shared/log_workflow_failure.py
      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/posted_quotes.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/ledgers/approval_queue.jsonl \
            data/ledgers/used_images.jsonl \
            data/ledgers/alerts.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: morning carousel $(date -u +%Y-%m-%dT%H:%M)Z"
          # Pull in any changes that landed after our checkout, then push.
          # --autostash handles any unstaged local changes from the pip/playwright steps.
          git pull --rebase --autostash origin main
          git push origin main
