name: Daily Metrics Fetch (21:00 BST)
# Lightweight - no FFmpeg, no Playwright. Fetches Graph API insights for all
# reels posted in the last 90 days and rewrites reel_performance.jsonl.
# Runs after all three daily posts and backup crons have settled (17:45 UTC).

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 21:00 BST
  workflow_dispatch:

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          TIMEZONE=UTC
          ENVEOF

      - name: Verify Meta token
        run: |
          VALID=$(python3 scripts/check_token.py 2>/dev/null || echo invalid)
          if [ "$VALID" != "ok" ]; then
            echo "::error::Meta access token invalid - metrics fetch skipped."
            exit 1
          fi
          echo "Token valid."

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Fetch reel performance metrics
        run: python3 scripts/fetch_reel_metrics.py

      - name: Commit metrics
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add data/ledgers/reel_performance.jsonl || true
          git diff --cached --quiet && echo "No metrics changes." && exit 0
          git commit -m "state: metrics $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
