name: Daily Reel (12:00 BST)
# v2

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 12:00 BST (primary)
    - cron: "45 11 * * *"     # 11:45 UTC = 12:45 BST (backup — skips if already posted)
  workflow_dispatch:

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          TIMEZONE=UTC
          ENVEOF

      - name: Check if reel already posted today + runway
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Idempotency: skip if reel already posted today
          COUNT=$(python3 -c "
import json; from pathlib import Path
try:
    lines=[l for l in Path('insta-brain/data/reels.jsonl').read_text().splitlines() if l.strip()]
    reels=[json.loads(l) for l in lines]
    today=[r for r in reels if r.get('published_at','').startswith('$TODAY')]
    print(len(today))
except: print(0)
" 2>/dev/null || echo 0)
          echo "Reels posted today: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already posted a reel today — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Runway check — discover if running low
            REMAINING=$(python3 -c "
import sys; sys.path.insert(0,'.')
from src.brain import brain
from src.research.rare_fact_bank import load_all_facts
q3=[f for f in load_all_facts() if f.get('quirky_score',0)>=2 and not brain.is_fact_posted(f['claim'])]
print(len(q3))
" 2>/dev/null || echo 99)
            echo "Reel runway: $REMAINING facts remaining"
            if [ "$REMAINING" -lt 14 ]; then
              echo "Runway below 14 — running fact discovery..."
              python3 scripts/discover_facts.py || echo "Discovery failed, continuing"
            fi
          fi

      - name: Post reel
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/make_reel.py

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/reel.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 scripts/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/reels.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/ledgers/used_footage_urls.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: reel $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
