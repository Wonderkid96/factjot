name: Daily Reel (12:00 BST)
# v3 — longer timeout; PYTHONUNBUFFERED on job; make_reel -u

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 12:00 BST (primary)
    - cron: "45 11 * * *"     # 11:45 UTC = 12:45 BST (backup - skips if already posted)
  workflow_dispatch:
    inputs:
      force:
        description: "Force-post even if a reel was already posted today (bypasses idempotency check)"
        type: boolean
        default: false
        required: false
      dry_run:
        description: "Compose video but skip upload and publish (safe preview)"
        type: boolean
        default: false
        required: false
      topic:
        description: "Restrict fact selection to a topic (space, history, biology, ocean, earth, technology, science)"
        required: false
        default: ""

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          TIMEZONE=UTC
          ENVEOF

      - name: Verify Meta token
        run: |
          VALID=$(python3 pipelines/shared/check_token.py 2>/dev/null || echo invalid)
          if [ "$VALID" != "ok" ]; then
            echo "::error::Meta access token is invalid or expired. Run refresh_token.py manually."
            python3 pipelines/shared/log_token_alert.py 2>/dev/null || true
            exit 1
          fi
          echo "Token valid."

      - name: Check if reel already posted today + runway
        id: check
        env:
          FORCE_POST: ${{ inputs.force }}
        run: |
          # Pull latest state - another concurrent run may have just posted
          # Fail closed: if pull fails, we can't trust ledger state -- skip to be safe
          if ! git pull --rebase --autostash origin main 2>/dev/null; then
            echo "::warning::git pull failed -- skipping to prevent duplicate post"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE_POST" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "FORCE_POST=true: bypassing idempotency check."
          else
            # Fail closed: if check script errors or is missing -- skip to be safe
            CHECK_OUT=$(python3 pipelines/shared/check_posted_today.py reel 2>/dev/null) || {
              echo "::warning::Idempotency check failed or script missing -- skipping to be safe"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            if echo "$CHECK_OUT" | grep -q already_posted; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Already posted a reel today - skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              REMAINING=$(python3 pipelines/reel/check_reel_runway.py 2>/dev/null || echo 99)
              echo "Reel runway: $REMAINING facts remaining"
              if [ "$REMAINING" -lt 14 ]; then
                echo "Runway below 14 - running fact discovery..."
                python3 pipelines/carousel/discover_facts.py || echo "Discovery failed, continuing"
              fi
            fi
          fi

      - name: Post reel
        if: steps.check.outputs.skip != 'true'
        run: |
          TOPIC_ARG=""
          if [ -n "${{ inputs.topic }}" ]; then TOPIC_ARG="--topic ${{ inputs.topic }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 -u pipelines/reel/make_reel.py --dry-run $TOPIC_ARG
          else
            python3 -u pipelines/reel/make_reel.py $TOPIC_ARG
          fi

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/reel.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 pipelines/shared/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/reels.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/ledgers/used_footage_urls.jsonl \
            data/ledgers/used_images.jsonl \
            data/ledgers/discovered_facts.jsonl \
            data/ledgers/alerts.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: reel $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
