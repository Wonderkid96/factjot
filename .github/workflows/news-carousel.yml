name: Breaking News Carousel (14:00 BST)

on:
  schedule:
    - cron: "0 13 * * *"     # 13:00 UTC = 14:00 BST (primary)
    - cron: "45 13 * * *"    # 13:45 UTC backup (skips if already posted)
  workflow_dispatch:
    inputs:
      section:
        description: "Guardian section override (world, technology, science, environment, uk-news)"
        required: false
        default: ""
      query:
        description: "Free-text search query override (overrides section if set)"
        required: false
        default: ""
      max_age:
        description: "Max article age in hours (default 24)"
        required: false
        default: "24"
      dry_run:
        description: "Dry run -- render but skip IG publish"
        type: boolean
        required: false
        default: false

# Shares the publish concurrency group with other post workflows.
# If two triggers overlap, the second queues -- never cancels.
concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GUARDIAN_API_KEY=${{ secrets.GUARDIAN_API_KEY }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Verify Meta token
        run: |
          VALID=$(python3 scripts/check_token.py 2>/dev/null || echo invalid)
          if [ "$VALID" != "ok" ]; then
            echo "::error::Meta access token is invalid or expired."
            python3 scripts/log_token_alert.py 2>/dev/null || true
            exit 1
          fi
          echo "Token valid."

      - name: Pull latest state
        run: git pull --rebase --autostash origin main 2>/dev/null || true

      - name: Post breaking news carousel
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.section }}" ]; then
            ARGS="$ARGS --section ${{ github.event.inputs.section }}"
          fi
          if [ -n "${{ github.event.inputs.query }}" ]; then
            ARGS="$ARGS --query \"${{ github.event.inputs.query }}\""
          fi
          if [ -n "${{ github.event.inputs.max_age }}" ]; then
            ARGS="$ARGS --max-age ${{ github.event.inputs.max_age }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/ship_news_post.py $ARGS

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/news-carousel.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 scripts/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            data/ledgers/news_posts.jsonl \
            insta-brain/log.md \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: news carousel $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
