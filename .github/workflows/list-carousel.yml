name: Evening List Carousel (18:00 BST)

on:
  schedule:
    - cron: "0 17 * * *"    # 17:00 UTC = 18:00 BST (primary)
    - cron: "45 17 * * *"   # 17:45 UTC = 18:45 BST (backup - skips if already posted)
  workflow_dispatch:

concurrency:
  group: factjot-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_GRAPH_HOST=${{ secrets.META_GRAPH_HOST }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE=${{ secrets.ELEVENLABS_VOICE }}
          COVERR_API_KEY=${{ secrets.COVERR_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          IMAGE_HOST=${{ secrets.IMAGE_HOST }}
          MUSIC_CREDIT=${{ secrets.MUSIC_CREDIT }}
          TIMEZONE=UTC
          ENVEOF

      - name: Verify Meta token
        run: |
          VALID=$(python3 scripts/check_token.py 2>/dev/null || echo invalid)
          if [ "$VALID" != "ok" ]; then
            echo "::error::Meta access token is invalid or expired. Run refresh_token.py manually."
            python3 scripts/log_token_alert.py 2>/dev/null || true
            exit 1
          fi
          echo "Token valid."

      - name: Check if list carousel already posted today
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(python3 -c "
import json; from pathlib import Path
try:
    lines=[l for l in Path('insta-brain/data/posted.jsonl').read_text().splitlines() if l.strip()]
    posts=[json.loads(l) for l in lines]
    today=[p for p in posts if p.get('published_at','').startswith('$TODAY') and str(p.get('claim','')).startswith('list:')]
    print(len(today))
except: print(0)
" 2>/dev/null || echo 0)
          echo "List carousels posted today: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already posted a list carousel today - skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post list carousel
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/ship_list_post.py --next

      - name: Capture failure to brain log
        if: failure()
        env:
          WORKFLOW_FILE: .github/workflows/list-carousel.yml
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: python3 scripts/log_workflow_failure.py

      - name: Commit and push state
        if: always()
        run: |
          git config user.name  "factjot-bot"
          git config user.email "bot@factjot"
          git add \
            insta-brain/data/posted.jsonl \
            insta-brain/data/posted_quotes.jsonl \
            insta-brain/data/queue.jsonl \
            insta-brain/log.md \
            insta-brain/MEMORY_INDEX.md \
            data/approval_queue.jsonl \
            data/ledgers/approval_queue.jsonl \
            || true
          git diff --cached --quiet && echo "No state changes to commit." && exit 0
          git commit -m "state: list carousel $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --autostash origin main
          git push origin main
