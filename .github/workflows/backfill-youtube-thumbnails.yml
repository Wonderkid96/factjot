name: Backfill YouTube thumbnails (one-shot)

# One-off backfill for the three Shorts that were uploaded before the
# YouTube channel was phone-verified, so the thumbnails().set call
# 403'd. Channel is now verified; this workflow re-applies the original
# branded thumbnails (already preserved on imgbb) to those three videos.
#
# Trigger: workflow_dispatch only. Delete this file after a successful run.
#
# Hard rules: no em dashes anywhere (GitHub's Go YAML parser rejects
# them and dispatch returns 422 with "no workflow_dispatch trigger").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet \
            google-api-python-client google-auth google-auth-oauthlib \
            pillow requests

      - name: Set thumbnails on the three published Shorts
        run: |
          python3 - <<'PY'
          import io, os, sys
          import requests
          from PIL import Image
          from google.oauth2.credentials import Credentials
          import google.auth.transport.requests
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseUpload
          from googleapiclient.errors import HttpError

          # Hardcoded one-shot mapping. Sources are the original branded
          # PNGs uploaded to imgbb during the original reel publish step;
          # they are the same images the workflow rendered on the runner.
          PAIRS = [
              ("AvD-3tsX5Rw",
               "https://i.ibb.co/9md0Gy1w/8416b3e60516.png",
               "Britain Rationed Bread After The War"),
              ("SIYdltVWtmg",
               "https://i.ibb.co/3YLxqNPg/1eb494d9d259.png",
               "They Planned to Nuke the Moon"),
              ("xQxrdm8gUQY",
               "https://i.ibb.co/Z4kbh0B/11d1d003a0e5.png",
               "The Radar That Broke the World's Radio"),
          ]

          cid     = os.environ["YOUTUBE_CLIENT_ID"]
          secret  = os.environ["YOUTUBE_CLIENT_SECRET"]
          refresh = os.environ["YOUTUBE_REFRESH_TOKEN"]
          creds = Credentials(
              token=None,
              refresh_token=refresh,
              client_id=cid,
              client_secret=secret,
              token_uri="https://oauth2.googleapis.com/token",
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          creds.refresh(google.auth.transport.requests.Request())
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)

          MAX_BYTES = 2 * 1024 * 1024
          failed = 0

          for video_id, png_url, title in PAIRS:
              print(f"\n=== {video_id} {title!r} ===", flush=True)
              try:
                  r = requests.get(png_url, timeout=30)
                  r.raise_for_status()
                  png_bytes = r.content
                  print(f"  fetched {len(png_bytes)//1024} KB PNG", flush=True)

                  # Re-encode to JPEG, drop quality if needed to fit 2 MB.
                  for quality in (85, 75, 60):
                      buf = io.BytesIO()
                      with Image.open(io.BytesIO(png_bytes)) as im:
                          im.convert("RGB").save(
                              buf, format="JPEG",
                              quality=quality, optimize=True, progressive=True,
                          )
                      jpg = buf.getvalue()
                      print(f"  jpeg q={quality} -> {len(jpg)//1024} KB", flush=True)
                      if len(jpg) <= MAX_BYTES:
                          break
                  else:
                      print(f"  ERROR: could not compress under 2 MB", flush=True)
                      failed += 1
                      continue

                  media = MediaIoBaseUpload(
                      io.BytesIO(jpg), mimetype="image/jpeg", resumable=False,
                  )
                  youtube.thumbnails().set(videoId=video_id, media_body=media).execute()
                  print(f"  OK thumbnail set on {video_id}", flush=True)

              except HttpError as exc:
                  print(f"  HttpError: {exc}", flush=True)
                  failed += 1
              except Exception as exc:
                  print(f"  Error: {exc}", flush=True)
                  failed += 1

          print(f"\n=== done. failures: {failed}/{len(PAIRS)} ===", flush=True)
          sys.exit(1 if failed else 0)
          PY
